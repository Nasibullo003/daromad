services:
  - type: web
    name: daromad
    env: go
    plan: free
    buildCommand: go build -o daromad_app .
    startCommand: ./daromad_app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daromad-db
          property: connectionString
      - key: TZ
        value: Asia/Dushanbe

databases:
  - name: daromad-db
    plan: free
    databaseName: daromad
    user: daromad
