databases:
  - name: daromad-db
    plan: free
    databaseName: daromad
    user: daromad

services:
  - type: web
    name: daromad
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daromad-db
          property: connectionString
      - key: TZ
        value: Asia/Dushanbe
